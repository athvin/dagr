# dagr continuous-integration gate — ticket T7 (ticket 006).
#
# This is the gate every subsequent implementation ticket lands through
# (arch.md "Stability", "System-level acceptance" criterion 8, "Documentation").
# It runs on every pull request and on pushes to `main` (bar docs-only ones — see
# the `paths-ignore` note on the trigger). Because pull_request events run the
# workflow file from the PR head, THIS workflow gates its own PR.
#
# The CHECK set mirrors the era-`ci` gate command list in the skill's
# quality-gates.md §2 (and scripts/run_gate.sh ci), under the toolchain pinned
# in rust-toolchain.toml (1.97.1). Checks are not one-to-one with jobs — several
# share a job where they share a build:
#   * fmt            — cargo fmt --all --check
#   * clippy         — cargo clippy --workspace --all-targets -- -D warnings
#   * test           — cargo test --workspace
#   * rustdoc        — RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
#   * audit          — cargo audit
#   * deny           — cargo deny check
#   * coverage-matrix — scripts/check-coverage-matrix.sh (system criterion 8);
#                      runs on the tier-1 `test` leg, whose compiled suite it needs
#
# UI / compile-fail (trybuild) snapshot tests (T8) run ONLY under this pinned
# toolchain, so their snapshot output is byte-stable; rust-toolchain.toml is the
# single source of truth the actions-rust setup below honours.
#
# --- BUILD-CACHE SCHEME (read this before adding a `Swatinem/rust-cache` step) -
# GitHub caps a repository's Actions cache at 10 GB and evicts least-recently-used
# entries once that is exceeded. This workflow blew straight through it: every job
# had its own cache key AND every pull request wrote a duplicate set into its own
# `refs/pull/N/merge` scope, reaching 12.89 GB across 56 entries. Eviction then
# decided at random which jobs came up warm, which is why identical runs took
# either ~3 minutes or ~10: one measured run restored the Linux leg fine (34 s
# build) while the macOS leg missed and recompiled for 4 m 01 s. The variance was
# never in the code, it was in the cache budget. Two rules keep it inside:
#
#   1. `save-if: ${{ github.ref == 'refs/heads/main' }}` — pull requests RESTORE
#      main's cache and never write one. Cache writes are therefore proportional
#      to merges, not to open PRs.
#   2. `shared-key: workspace` wherever jobs genuinely share a build, with exactly
#      ONE designated WRITER per distinct cache key; every other job on that key
#      sets `save-if: false` and is a pure reader. This collapses the Linux jobs
#      that were each storing a near-identical copy of the same dependency build
#      into one entry.
#
#   Partitioning is automatic: rust-cache hashes the runner OS and the build
#   environment into the key itself, so the macOS `test` leg, the `RUSTDOCFLAGS`
#   job, and the `RUSTFLAGS: ""` determinism job land on distinct keys without
#   anyone hand-assigning them. A single writer (rather than letting jobs race to
#   save) means the stored entry is always the one from the job that builds the
#   most, not whichever light job happened to finish first.
#
#   SHARING IS NOT FREE, AND THE TEST IS MEASUREMENT, NOT ARCHITECTURE. `clippy`
#   looks like it should read the `workspace` entry — same toolchain, same flags,
#   dependencies built by the same rustc — and reading it made the job 17x slower
#   (8 s to 134 s), because what clippy actually spends its time on is linting
#   dagr's own targets through clippy-driver, and no other job produces those
#   artifacts. It keeps its own key. Before pointing a new job at `workspace`,
#   compare the step time both ways; a plausible story about shared dependencies
#   is not evidence.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The ticket loop lands a `docs: mark NNN TNN done` checkbox flip on main after
    # every merge, and each one was triggering the entire gate a second time for a
    # markdown edit. Nothing in CI reads `docs/implementation/**`: the pin checker
    # excludes the directory explicitly (check-edition-and-msrv-pins.sh treats those
    # files as the historical record), and the only other CI script that mentions the
    # path does so in a comment. PUSH ONLY — `pull_request` stays unfiltered, because
    # a filtered PR trigger reports no checks at all rather than passing ones, which
    # is indistinguishable from a gate that never ran.
    paths-ignore:
      - 'docs/implementation/**'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail the whole build on any warning even outside the lint-configured paths.
  RUSTFLAGS: "-D warnings"

jobs:
  # --- Pinned-toolchain guard (arch.md "Stability" MSRV/toolchain) ------------
  # Installs the toolchain pinned in rust-toolchain.toml and asserts that rustup
  # resolves it as the active toolchain, so every other job — and T8's UI /
  # compile-fail snapshot tests — runs deterministically on 1.97.1. Satisfies
  # the Test-plan item "Pinned toolchain is honored".
  #
  # The second step (T94) closes the other half: rustup honouring the pin proves
  # nothing if the pin itself has drifted out of step with the five OTHER places
  # dagr writes it down (the manifest, rustfmt.toml, the README MSRV line, the
  # stability gate, and the UI harness's `--edition`). A migration that updates
  # five of six sites reviews clean and is wrong, so the agreement is asserted
  # mechanically, tree-wide, with `docs/implementation/*.md` excluded as the
  # historical record it is.
  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and honor the pinned toolchain
        run: |
          rustup show active-toolchain
          pinned="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
          echo "pinned channel from rust-toolchain.toml: ${pinned}"
          active="$(rustup show active-toolchain | awk '{print $1}')"
          echo "active toolchain: ${active}"
          case "${active}" in
            "${pinned}"*) echo "OK: active toolchain matches the pinned channel";;
            *) echo "MISMATCH: active '${active}' does not start with pinned '${pinned}'"; exit 1;;
          esac
      - name: Every pin site agrees, and the edition-2024 surface holds
        run: bash scripts/check-edition-and-msrv-pins.sh

  # --- Formatting -------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rustfmt)
        run: rustup component add rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # --- Clippy with warnings denied -------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (clippy)
        run: rustup component add clippy
      # WRITER of its own key (see BUILD-CACHE SCHEME above), and it MUST be one.
      #
      # This job was briefly a reader of the `workspace` entry, on the reasoning that
      # `cargo clippy` builds dependencies with ordinary rustc and so could live off
      # what `test` stores. Measured, that was wrong by 17x: the clippy step went from
      # 8 s to 134 s. Dependencies are indeed shared, but they are not the expensive
      # half — linting dagr's OWN 125-plus targets is, and those artifacts come from
      # clippy-driver, which nothing in `test`'s entry contains. Restoring the larger
      # `workspace` entry also cost 19 s instead of 3. The 0.15 GB this key holds buys
      # back 140 seconds on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # --- Tests: the T70 platform matrix (Linux tier-1 + macOS core) ------------
  # arch.md "Platform support" (lines 627-633) commits to a two-tier CI posture,
  # which T70 (ticket 077) wires here as a single `test` job fanned over an `os`
  # matrix. Windows is DELIBERATELY ABSENT (arch.md: "explicitly unsupported in
  # v1"; no Windows runner, no signal/process-model shim — see
  # docs/coverage-matrix.md "Platform-conditional criteria (for T70)").
  #
  #   * ubuntu-latest — TIER 1. Runs the COMPLETE `cargo test --workspace`
  #     suite: unit, integration, fault-injection (T37 permit-release, T36
  #     unwritable-sink), the C12 cgroup v2/v1 limit-detection tests, and the
  #     C16 OS-signal tests (SIGTERM/SIGINT → cancel → complete + fsync'd
  #     stream) — the everything-works reference ("the full test suite runs in
  #     CI here"). The schema-validation, scale-benchmark, and render steps that
  #     were on this job stay Linux-only (below and in their own jobs).
  #   * macos-latest — the CORE suite. macOS is unix, so everything compiles and
  #     the C16 `#[cfg(unix)]` signal tests run here too; pool sizing exercises
  #     the T32 HOST-FALLBACK path (no cgroups). The Linux-only C12 cgroup-
  #     DETECTION tests are excluded BY INTENT via an explicit, reviewable
  #     `--skip` set (NOT `continue-on-error`): removing a core test would still
  #     fail the job. The excluded set is the three tests that assert a cgroup
  #     source was found; the host-fallback tests (the correct macOS behaviour)
  #     stay in the run and must pass.
  #
  # Both legs honour rust-toolchain.toml (rustup resolves the pinned 1.97.1 on
  # every runner OS), so the T8 compile-fail UI snapshots are byte-stable on
  # both — DAGR_BLESS is unset, so a stale snapshot fails rather than being
  # rewritten. `cargo test --workspace` runs the UI harness
  # (crates/core/tests/ui.rs); the explicit step below runs it first so a
  # snapshot mismatch is legible in the log (T8 DoD).
  #
  # fail-fast is off so a macOS-only or Linux-only failure is both visible in one
  # run rather than cancelling its sibling.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # The designated WRITER for this key (see BUILD-CACHE SCHEME above). This job
      # compiles more than any other — every target, plus the `schema-validation`
      # and `metastore` feature builds — so the entry it stores is the one that
      # serves the reader jobs best. Each matrix leg writes its own OS-keyed entry.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # TRIAL: cargo-nextest. `cargo test` runs dagr's 125 integration-test targets
      # STRICTLY ONE BINARY AT A TIME, parallelising only with threads inside each;
      # nextest runs every test in its own process from one pool spanning all of
      # them, so a long binary overlaps the rest instead of blocking the queue.
      # Config — including what must NOT be parallelised — is in .config/nextest.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: compile-failure UI harness (T8, pinned toolchain)
        run: cargo nextest run -p dagr-core --test ui
      # TIER 1 (Linux): the complete suite, nothing filtered.
      - name: cargo nextest run --workspace (Linux tier-1, full suite)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --workspace
      # CORE (macOS): the same workspace suite MINUS the Linux-only C12 cgroup-
      # DETECTION tests, excluded by an explicit named set. The host-fallback C12
      # tests are NOT skipped — they are the macOS behaviour and must pass here
      # (T70 DoD: "macOS pool sizing is exercised through the T32 host-fallback
      # path (no cgroups), and that host-fallback test passes on macOS"). Skipping
      # is by intent, not allow-failure: a core-test regression still reds this job.
      #
      # `-E 'not (test(a) or test(b) or test(c))'` is nextest's spelling of the
      # three `--skip` flags this replaces; `test(...)` is a substring match, the
      # same matching `--skip` did, so the excluded set is unchanged.
      - name: cargo nextest run --workspace (macOS core suite, Linux-only cgroup detection skipped)
        if: matrix.os == 'macos-latest'
        run: |
          cargo nextest run --workspace -E 'not (
            test(container_limits_size_the_admission_pools_from_cgroup_v2) or
            test(cgroup_v1_is_used_when_v2_is_absent) or
            test(the_pinning_flag_overrides_cgroup_detection)
          )'
      # Scale benchmark (T69, ticket 076): the Performance-envelope gate. Drives a
      # thousand-node no-op graph through the REAL T24 run-loop driver
      # (`dagr_cli::scale_bench`), measures per-node framework overhead, and FAILS
      # ON REGRESSION against a checked-in budget (arch.md "Performance envelope":
      # framework overhead per node budgeted under 1 ms/node). This step runs the
      # benchmark on its own (with output captured) so a budget regression is
      # legible in the job log and unambiguously gates the build, alongside — not
      # replacing — the ordinary `cargo test --workspace` above (which also runs it).
      #
      # RUNNER NORMALIZATION / CI RELIABILITY: admission capacity is PINNED via the
      # C12 pinning flag to a fixed benchmark configuration (`bench_capacities`), so
      # the measurement is a property of dagr's overhead, not of the runner's
      # cgroup/host limits or core count — deterministic run to run and machine to
      # machine. A wall-clock benchmark on a shared runner is inherently noisy, so
      # the gate is a GENEROUS budget (16 ms/node, 16× the 1 ms spec ceiling): it
      # catches an orders-of-magnitude regression while ordinary variance never
      # flaps it. Correctness is carried by the benchmark's DETERMINISTIC invariants
      # (exactly 1000 nodes, every node succeeded, phases sum exactly, pinned
      # capacity), not by the timing number; each run uses a private per-run temp
      # base (no shared /tmp race). `--nocapture` surfaces the measured per-node
      # overhead in the log for re-baselining.
      # Linux tier-1 only: the T69 perf gate and the schema-validation steps
      # below are the everything-works reference checks (T70 keeps the macOS leg
      # the lean core suite; these are not part of it). The scale benchmark also
      # ran only on ubuntu before T70 — this `if` preserves that exactly. (Each
      # runs under the same `cargo test --workspace` on the macOS leg implicitly
      # only if part of the default suite; these feature-gated / explicit steps
      # are intentionally Linux-only.)
      - name: scale benchmark — Performance-envelope budget (T69)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run -p dagr-cli --test scale_benchmark --no-capture
      # Published-artifact-schema validation (T39, ticket 050). The validation
      # helper and its `jsonschema` dependency are gated behind the
      # `schema-validation` feature (OFF by default, so the runtime writers pull
      # no schema validator — T4 ADR 017 §4). This step turns the feature ON to
      # run the schema suite (C19/C20/C22 validation) AND the standing
      # fixture-corpus round-trip (T0.10 / Stability: "a corpus parsed in CI
      # forever after"), which fails loudly if any checked-in corpus fixture no
      # longer validates against its declared version's published schema. T48
      # extends this into the enduring compatibility gate + scale artifact.
      - name: artifact-schema validation + fixture-corpus round-trip (T39)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run -p dagr-artifact --features schema-validation --test artifact_schemas
      # C20 graph-artifact emission (T40, ticket 051): a REAL emitted artifact is
      # round-tripped against the published `schemas/graph/v1.schema.json` via the
      # same T39 helper. Gated behind cli's `schema-validation` feature (which
      # forwards to dagr-artifact's), so the `jsonschema` validator is pulled only
      # here — the shipped binary and the bare `cargo test --workspace` never do.
      - name: graph-artifact schema round-trip (T40)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run -p dagr-cli --features schema-validation --test graph_artifact_schema_roundtrip
      # C22 artifact validation + schema-compatibility gate (T48, ticket 059).
      # The enduring compatibility CI: the frozen fixture corpus parses forever
      # after (every checked-in fixture round-trips against its declared version's
      # published schema, directory-enumerated so new fixtures are auto-covered),
      # evolution is provably additive-only (a drift guard rejects any published
      # schema that closes an object — the mechanical shape of a non-additive
      # change), the corpus is complete (a new schema version without a matching
      # fixture fails the build), and the ten-thousand-attempt scale artifact —
      # GENERATED from the real producers (writer → fold), frozen as a corpus
      # member — validates, parses, and stays size-proportional to attempt count.
      # Deterministic + reliable: pure Rust through the same CI-/dev-scoped
      # `jsonschema` helper the steps above use (no browser, no network, no
      # unpinned install), behind the `schema-validation` feature.
      - name: artifact validation + schema-compatibility gate (T48)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run -p dagr-artifact --features schema-validation --test compatibility_ci
      # === M7 metastore: the feature-gated CLI suites =========================
      # The `metastore` cli feature is OFF by default (libSQL is heavy and pre-1.0),
      # so the plain `cargo test --workspace` above never pulls `libsql` through the
      # cli and never sees the `metastore` verb. The suites below turn it ON.
      #
      # They are grouped into TWO cargo invocations rather than the five they used
      # to be. All five share one `--features metastore` build of dagr-cli, but a
      # separate `cargo test` per test target rebuilt the fingerprint, linked, and
      # ran strictly one target at a time; one invocation with several `--test`
      # flags links them in parallel and pays cargo's startup once. Legibility is
      # unaffected — a failure still names its own test and target in the output,
      # which is what the T86/T87/T88 DoDs ask for.
      #
      # The split between the two is the platform tier, not the ticket:
      #   * BOTH tiers — T86 live tee, T87 example + cookbook, T88 acceptance gate.
      #     Their DoDs require ubuntu + macOS: the live sink runs a worker thread on
      #     a tokio runtime, and the acceptance gate exercises multi-process live
      #     writes, whose behaviour is platform-relevant (POSIX byte-range locks and
      #     process-spawn timing differ on macOS).
      #   * LINUX TIER-1 ONLY — T83 init verb and T84 sync verb, plus the two
      #     structural scripts. Crate-graph facts and the verbs themselves are
      #     platform-independent, so the macOS leg stays the lean core suite.
      #
      # T87 and T88 shell out to `sqlite3` (preinstalled on both runner images), so
      # DAGR_REQUIRE_SQLITE3=1 makes an absent `sqlite3` a HARD failure here while a
      # dev machine without it still skips. The variable is inert for the T86 tee,
      # which reads it nowhere — it is set once for the group rather than split into
      # a third invocation just to scope an unread variable.
      #
      # T86: the CLI driver-boundary test (byte-identical stream, the sink-failure
      # exit on a metastore write fault, toggle default-off). The dagr-metastore
      # MetastoreSink tests themselves are a normal workspace member and already ran
      # above, cross-platform, for free.
      # T87: the docs-truthfulness guards (tests/metastore_docs_claims.rs) also ran
      # above with no libsql; THIS is the feature-gated proof — several of the
      # example's DAGs run into one store, and the cookbook's copy-paste `sqlite3`
      # query block is executed verbatim against the result.
      # T88: the terminal M7 gate — (a) `metastore init` -> several DAGs run LIVE as
      # separate processes against one store -> `sync <base>` -> a native `sqlite3`
      # cross-run aggregate; (b) a metastore write fault surfaces as the sink-failure
      # exit; (c) live == reconcile parity.
      - name: metastore live tee + example/cookbook + acceptance gate (T86/T87/T88, --features metastore)
        env:
          DAGR_REQUIRE_SQLITE3: "1"
        run: |
          cargo nextest run -p dagr-cli --features metastore \
            --test metastore_live_tee \
            --test metastore_example_and_docs \
            --test metastore_acceptance_gate
      # T83 init verb + T84 sync verb. T84's mapping crate tests build under the
      # plain `cargo test --workspace` above (dagr-metastore is a normal member);
      # only the CLI `sync` verb's subprocess test needs the feature ON.
      - name: metastore init + sync verbs (T83/T84, --features metastore)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo nextest run -p dagr-cli --features metastore \
            --test metastore_init \
            --test metastore_sync
      # The structural gate proving the feature is truly default-off: default cli
      # reaches neither libsql nor dagr-metastore; --features metastore reaches both;
      # core reaches neither even --all-features; libsql pinned exactly.
      - name: metastore feature-gating (T83)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-metastore-feature-gating.sh
      # The STRUCTURAL half of the T88 gate (boundary invariants d): crate-graph +
      # M6->M7-diff facts a unit test cannot reach. Default `cargo build --all` /
      # `cargo build -p dagr-cli --no-default-features` pull no libsql/dagr-metastore
      # through the cli; `--no-default-features` leaves dagr-core's runtime dep set
      # empty; dagr-metastore has no path to dagr-core; and the M6->M7 diff adds no
      # scheduler/server/pgwire surface. Composes the T83 feature-gating script.
      # Crate-graph facts are platform-independent, so Linux tier-1 is enough.
      - name: metastore acceptance boundary — crate graph + no new surface (T88)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-metastore-acceptance-boundary.sh
      # --- Acceptance-criteria coverage matrix (system criterion 8) ------------
      # Verifies that every machine-classed criterion in the partition is bound to
      # an existing test (or an explicitly-deferred `unmapped` placeholder) in the
      # checked-in coverage matrix, and (T65) that every human-classed criterion has
      # a `[<id>]`-tagged line in the version-controlled release checklist — a human
      # criterion in the partition with no such line fails the build.
      #
      # This lives on the tier-1 test leg rather than in a job of its own because it
      # resolves mapped test ids via `cargo test --workspace -- --list`, i.e. it needs
      # the compiled test suite this job has ALREADY built. Standalone, it spent 40
      # seconds rebuilding that suite from a second 0.23 GB cache entry to run a
      # listing that takes about two; the criteria are platform-independent, so
      # tier-1 is the right and only place for it.
      - name: Verify the coverage matrix
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-coverage-matrix.sh --checklist docs/release-checklist.md
      - name: Self-test the coverage-matrix verifier
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-coverage-verifier-selftest.sh

  # --- Diagram renderer reference-tool acceptance (C24 / T46) -----------------
  # arch.md C24 line 520: "both output formats are accepted by their reference
  # tools in CI: `dot` parses; Mermaid's parser accepts." This job installs the
  # two reference tools — Graphviz (`dot`) and **Mermaid's own parser**
  # (`mermaid.parse()` from the `mermaid` library, run browserless under Node) —
  # and runs the renderer's reference-tool gate over a REAL rendered 30-node
  # fixture. `DAGR_REQUIRE_RENDER_TOOLS=1` makes an absent tool a HARD FAILURE
  # here (locally, an absent tool skips so `cargo test --workspace` stays green
  # on a dev machine without Graphviz/Node), so the gate is mandatory exactly
  # where the ticket requires it. The gate has teeth: the same tests feed each
  # tool a deliberately-malformed diagram and assert it is rejected. It also runs
  # the `schema-validation`-gated fixture check, proving the checked-in 30-node
  # fixture validates against schemas/graph/v1.schema.json.
  #
  # The DoD requires "Mermaid's PARSER accepts" (057 DoD; arch.md C24 line 520),
  # NOT SVG rendering — so we do NOT use the `mmdc` CLI, which launches headless
  # Chromium via puppeteer (no Chromium deps / `--no-sandbox` in CI → the browser
  # cannot launch → the gate failed for infra reasons, not renderer reasons).
  # Instead we install the `mermaid` library plus `jsdom` (a browserless DOM) at
  # PINNED versions into a scratch project and point `DAGR_MERMAID_PARSE_DIR` at
  # it; the test calls `mermaid.parse()` directly. This removes all Chromium
  # fragility from every future PR while checking the exact arch-required
  # guarantee.
  render-reference-tools:
    name: render-reference-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reader (see BUILD-CACHE SCHEME above).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      # Install only if the runner image does not already ship `dot`. When it does,
      # this skips an `apt-get update` + install (~10 s) outright; when it does not,
      # the full refresh-then-install still runs, so this cannot regress into the
      # stale-index 404 that dropping `apt-get update` unconditionally would risk.
      # `dot -V` runs either way — the tool's presence is still asserted, never
      # assumed.
      - name: Install Graphviz (the `dot` reference tool)
        run: |
          if ! command -v dot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          fi
          dot -V
      # Install Mermaid's parser browserless: the `mermaid` library (whose
      # `mermaid.parse()` IS Mermaid's parser) + `jsdom` (a DOM so the library's
      # DOM/DOMPurify needs are met without a browser). Pinned versions — the
      # reviewer flagged an unpinned install as a reliability risk. Installed
      # LOCALLY into a scratch dir (not `-g`) because Node resolves the parse
      # helper's bare ESM imports against a co-located `node_modules`; the test
      # writes its helper into $DAGR_MERMAID_PARSE_DIR for exactly this reason.
      #
      # DELIBERATELY NOT CACHED. The install measures ~8 seconds; a cache entry for it
      # would cost ~150 MB of the repository's 10 GB Actions budget — the very budget
      # the scheme at the top of this file exists to defend — to save less time than
      # restoring it takes. Cache what is expensive to rebuild, not what is merely
      # repeated.
      - name: "Install Mermaid's parser (browserless: mermaid + jsdom, pinned)"
        run: |
          mkdir -p "${RUNNER_TEMP}/mermaid-parse"
          cd "${RUNNER_TEMP}/mermaid-parse"
          npm install --no-audit --no-fund mermaid@11.16.0 jsdom@25.0.1
          node -e "console.log('mermaid', require('mermaid/package.json').version, '| jsdom', require('jsdom/package.json').version)"
      # The 30-node render fixture validates against the published graph schema
      # (T39 helper, behind the CI-/dev-scoped `schema-validation` feature).
      - name: render fixture schema-validity (T46)
        run: cargo test -p dagr-render --features schema-validation --test fixture_schema_valid
      # `dot` parses the rendered DOT and Mermaid's parser accepts the rendered
      # Mermaid (browserless); malformed inputs are rejected (teeth). Mandatory:
      # DAGR_REQUIRE_RENDER_TOOLS. DAGR_MERMAID_PARSE_DIR is the scratch project
      # whose node_modules the parse helper resolves against.
      - name: DOT + Mermaid accepted by their reference tools (C24)
        env:
          DAGR_REQUIRE_RENDER_TOOLS: "1"
          DAGR_MERMAID_PARSE_DIR: ${{ runner.temp }}/mermaid-parse
        run: cargo test -p dagr-render --test reference_tools
      # The M3 gate demo (T49) renders the run-overlaid diagram from artifacts
      # alone; its overlay scenario feeds the OVERLAID DOT/Mermaid through the same
      # reference tools under the same mandatory env, so the M3 done-when's
      # "rendered diagram is reviewable" clause is enforced in CI (arch.md C24 line
      # 520 / M3). Absent locally it skips like the render suite above.
      - name: M3 demo overlay accepted by their reference tools (C24 / T49)
        env:
          DAGR_REQUIRE_RENDER_TOOLS: "1"
          DAGR_MERMAID_PARSE_DIR: ${{ runner.temp }}/mermaid-parse
        run: cargo test -p dagr-cli --test m3_demo_explain_a_run overlay_renders_from_artifacts_only_and_is_structurally_sound

  # --- Rustdoc-on-public-items lint (Documentation) --------------------------
  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      # WRITER for its own key (see BUILD-CACHE SCHEME above). `RUSTDOCFLAGS` is part
      # of the environment rust-cache hashes, so this job lands on a distinct key from
      # the `workspace` readers even though it declares the same shared name — which
      # is why it has to store its own entry rather than read someone else's.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
        run: cargo doc --workspace --no-deps

  # --- Supply-chain: advisories (cargo audit) --------------------------------
  # The tool is fetched as a PREBUILT release binary, not built from source.
  # `cargo install --locked cargo-audit` took 148 seconds of the job's 158 — the
  # check itself is 5 — which made compiling a tool the longest job in the whole
  # gate and therefore the workflow's critical path. `taiki-e/install-action`
  # downloads the upstream release artifact for the runner and verifies its
  # checksum, so the `cargo audit` invocation below is unchanged and the gate is
  # exactly as strict; only the way the binary arrives is different.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # --- Supply-chain: licenses/sources/advisories/bans (cargo deny) -----------
  # Prebuilt for the same reason as `audit` above: the from-source install was
  # 122 seconds of a 130-second job whose actual check takes 2.
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  # --- rust-skills adoption register (T92) ------------------------------------
  # docs/rust-skills-register.md dispositions every rule in the
  # .claude/skills/rust-skills skill exactly once, with a reason. This job is
  # what stops it rotting into a decorative table: it fails when a rule is
  # skipped, contradicted, dangling, given a bare verdict, or when an `adopt` row
  # names a ticket outside M9. The rule total is derived from the rules
  # directory, so a rule added upstream fails the build until it is
  # dispositioned — which is the point.
  #
  # It needs no toolchain (two bash scripts over markdown), so it runs without a
  # rust-cache step and is one of the fastest checks in the gate.
  rust-skills-register:
    name: rust-skills-register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the rust-skills adoption register
        run: bash scripts/check-rust-skills-adoption.sh
      - name: Self-test the register verifier
        run: bash scripts/check-rust-skills-verifier-selftest.sh

  # --- Cargo build profiles (T93) ---------------------------------------------
  # The workspace's compiler settings are a checked-in decision with two
  # load-bearing GUARANTEES inside it, not just tuning:
  #
  #   * `panic = "abort"` must never be set, by any profile or rustflag. dagr
  #     contains a task panic with `catch_unwind` and reports it as a panicked
  #     attempt; under abort there is nothing to catch, and
  #     `execution::check_panic_strategy` refuses to start the run at all.
  #   * `strip` must never be enabled — dagr attributes a panic to its node
  #     through a panic hook, and needs the symbols to do it.
  #
  # scripts/check-cargo-profiles.sh asserts both mechanically (and proves the
  # scans non-vacuous against a fixture that does set them), plus pins the profile
  # values so LTO or codegen-units cannot silently drift back to Cargo's defaults
  # and quietly cost the per-node budget arch.md's "Performance envelope" holds.
  #
  # The second step is the guarantee end-to-end rather than by inspection: the
  # panic-containment suite, compiled under the real `[profile.release]` this
  # ticket adds (fat LTO, one codegen unit, explicit `panic = "unwind"`). If the
  # release profile ever did break containment, this is the job that says so.
  # dagr-core carries no runtime dependencies, so the LTO'd release build is cheap.
  cargo-profiles:
    name: cargo-profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reader (see BUILD-CACHE SCHEME above).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: Verify the Cargo build profiles
        run: bash scripts/check-cargo-profiles.sh
      - name: Panic containment holds under the release profile
        run: cargo test -p dagr-core --release --test panic_containment

  # --- Crate docs, publish metadata, and the lint pair (T96) -------------------
  # Three invariants a release day would otherwise discover the hard way:
  #
  #   * every member declares the metadata a crates.io release needs, and a
  #     member that is not `publish = false` carries the full set — including a
  #     version requirement on every intra-workspace path dependency, without
  #     which `cargo package` refuses the manifest outright. The publish graph is
  #     asserted CLOSED, because an unpublishable dependency silently makes every
  #     crate that reaches it unpublishable too;
  #   * every crate's README is inlined into its crate root with
  #     `#![doc = include_str!("../README.md")]`, so the crates.io landing page
  #     and the rustdoc front page cannot drift apart;
  #   * `lints.toml` (the source of truth) and `[workspace.lints]` (the applied
  #     form Cargo reads) agree field for field — a documented pair with no other
  #     guard — the two ratcheted lints stay `deny`, and every production
  #     suppression is an `#[expect(…, reason = "…")]` that expires loudly rather
  #     than an `#[allow]` that never does.
  #
  # Both scripts prove their own scans non-vacuous against fixtures that violate
  # every rule, so neither can rot into a decorative pass.
  crate-docs-and-metadata:
    name: crate-docs-and-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reader (see BUILD-CACHE SCHEME above).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: Verify the crate metadata, READMEs, and doc examples
        run: bash scripts/check-crate-docs-and-metadata.sh
      - name: The lint policy agrees with itself
        run: bash scripts/check-lint-parity.sh
      - name: Doc examples compile and run
        run: cargo test --doc --workspace

  # --- Cross-toolchain determinism: C21 fingerprints + SL4a artifact (T41, T65) --
  # TWO independent guarantees, both of the form "build the same source under two
  # different toolchains and diff the output byte-for-byte":
  #
  #   * C21 / T41 — "two builds of unchanged source, on different toolchains,
  #     produce the same structural fingerprint and policy hash" (T0.7 §5), via the
  #     `fingerprint_fixture` example (a fixed pipeline that prints its two
  #     version-prefixed fingerprint strings).
  #   * SL4a / T65 — system-level acceptance criterion 4(a), which EXTENDS the
  #     fingerprint-only check to the full artifact: "two builds of the same source
  #     produce identical fingerprints AND byte-identical graph artifacts
  #     (generation time aside)", via the `reference_pipeline_artifact` example
  #     (the reference pipeline's MASKED graph artifact, generation-time blanked,
  #     plus both C21 fingerprint strings).
  #
  # They live in ONE job because they are the same experiment run over two examples
  # from the same crate: identical runner, identical `RUSTFLAGS` override, identical
  # pair of toolchains. As two jobs they installed `stable` twice, built dagr-cli
  # under it twice, and kept two near-identical caches — paying for the setup twice
  # to assert two things about one build. Both examples live in dagr-cli, so a single
  # job compiles the shared dependency graph once and each example on top of it.
  #
  # The two assertions remain SEPARATE steps with their own `::error::` messages, so
  # a failure still says which guarantee broke, not merely that determinism did.
  structural-determinism:
    name: structural-determinism
    runs-on: ubuntu-latest
    # Override the workspace RUSTFLAGS='-D warnings': the second toolchain may
    # introduce lints the code is not obligated to be clean under (clippy/fmt on
    # the pinned toolchain are the lint gate). This job checks only the artifact +
    # fingerprint byte-equality across toolchains, not lint-cleanliness on stable.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # WRITER for its own key (see BUILD-CACHE SCHEME above). The empty `RUSTFLAGS`
      # is hashed into the key, so this job cannot share the `workspace` readers'
      # entry however it is named — it builds an entirely separate dependency graph.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Toolchain 1: the pinned channel from rust-toolchain.toml (honoured
      # automatically by rustup on `cargo run` in the repo). Both examples are run
      # under it before the second toolchain is installed.
      - name: Fingerprint + reference artifact under the pinned toolchain
        run: |
          cargo run --quiet -p dagr-cli --example fingerprint_fixture > fp-pinned.txt
          cargo run --quiet -p dagr-cli --example reference_pipeline_artifact > ref-pinned.txt
          echo "pinned toolchain fingerprints:"; cat fp-pinned.txt
          echo "pinned-toolchain reference artifact + fingerprints:"; cat ref-pinned.txt
      # Toolchain 2: a DIFFERENT channel. `+stable` overrides the pinned channel for
      # these invocations, so the examples are built and run by a second rustc. (On
      # the runner's default image `stable` differs from the pinned 1.97.1; if they
      # ever coincide the diffs still pass — equal is equal.)
      - name: Install a second toolchain (stable)
        run: rustup toolchain install stable --profile minimal
      - name: Fingerprint + reference artifact under the second toolchain
        run: |
          cargo +stable run --quiet -p dagr-cli --example fingerprint_fixture > fp-stable.txt
          cargo +stable run --quiet -p dagr-cli --example reference_pipeline_artifact > ref-stable.txt
          echo "second toolchain fingerprints:"; cat fp-stable.txt
          echo "second-toolchain reference artifact + fingerprints:"; cat ref-stable.txt
      # Load-bearing assertion 1 (C21 / T41): the fingerprints alone.
      - name: Compare — the fingerprints MUST be byte-identical across toolchains
        id: c21
        run: |
          if ! diff -u fp-pinned.txt fp-stable.txt; then
            echo "::error::C21 cross-toolchain fingerprint divergence — the two toolchains produced different fingerprints for unchanged source"
            exit 1
          fi
          echo "OK: fingerprints are byte-identical across toolchains (C21 / SL4a)"
      # Load-bearing assertion 2 (SL4a / T65): the masked graph artifact AND both
      # fingerprint strings.
      #
      # The condition runs this when everything so far is green OR when the ONLY
      # thing that failed is the C21 comparison above, so a single run reports both
      # verdicts instead of hiding the second behind the first. It deliberately does
      # NOT use a blanket `!cancelled()`: if a `cargo run` step failed there is no
      # `ref-*.txt` to diff, and reporting `No such file` on top of the real error
      # would bury the cause rather than add a verdict.
      - name: Compare — the graph artifact + fingerprints MUST be byte-identical
        if: success() || steps.c21.conclusion == 'failure'
        run: |
          if ! diff -u ref-pinned.txt ref-stable.txt; then
            echo "::error::SL4a structural-determinism divergence — the two toolchains produced a different masked graph artifact or fingerprint for unchanged source"
            exit 1
          fi
          echo "OK: masked graph artifact + fingerprints are byte-identical across toolchains (SL4a)"

  # --- The SYSTEM ACCEPTANCE GATE (system-level acceptance, T65) --------------
  # The terminal required gate. It is RED unless every constituent is green: the
  # milestone demos (T28/T38/T49/T63) and the whole workspace suite (which
  # includes the T65 acceptance suite `crates/cli/tests/system_acceptance_gate.rs`)
  # run under `test`; the scale benchmark (T69), the platform matrix (T70), and the
  # criteria-matrix + release-checklist closure run under `test` too; determinism —
  # both the C21 fingerprint check and the SL4a artifact check — runs under
  # `structural-determinism`. `needs` all of them, so a red constituent blocks the
  # gate: a red demo, a red platform leg, a determinism divergence, or an
  # unmapped/uncovered criterion cannot be merged past this job.
  #
  # This job runs no new work — it is the single required status that DEPENDS on the
  # constituents, making "all system-level acceptance criteria hold simultaneously" a
  # single mergeable signal. It therefore does NOT check out the repository: it has
  # no file to read, and cloning one to print a paragraph is pure latency on the
  # last job of every run.
  system-acceptance-gate:
    name: system-acceptance-gate
    runs-on: ubuntu-latest
    needs:
      - toolchain
      - fmt
      - clippy
      - test
      - rustdoc
      - audit
      - deny
      - render-reference-tools
      - structural-determinism
      - rust-skills-register
      - cargo-profiles
      - crate-docs-and-metadata
    steps:
      - name: All system-level acceptance constituents are green
        run: |
          echo "All required constituents (demos + full suite + scale benchmark +"
          echo "platform matrix + determinism + coverage/checklist closure) are green."
          echo "The T65 system acceptance gate is satisfied: every machine-classed"
          echo "acceptance criterion maps to a passing test and every human-classed"
          echo "criterion is on the version-controlled release checklist."
