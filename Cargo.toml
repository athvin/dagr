# dagr — Cargo workspace.
#
# Topology decided by the ADR embedded in ticket 003 (T1),
# docs/implementation/003-T1-crate-layout-and-workspace-skeleton.md: a
# multi-crate workspace (not a single facade crate) with a separable renderer,
# because C24 requires that rendering consume artifacts only and need no access
# to the binary that produced them — a guarantee that is *structural* (a
# missing crate-graph edge) only when the crates are separate.
#
# Dependency direction (enforced by these manifests, checked by
# scripts/check-workspace-skeleton.sh):
#   cli      -> core, artifact, render     (the pipeline binary; the one place
#                                           the live pipeline and rendering meet)
#   render   -> artifact                    (renderers consume artifacts only; C24)
#   metastore-> artifact, libsql, tokio      (the opt-in run index; artifact-only
#                                           workspace edge, NO edge onto core — the
#                                           same C24-style boundary as render, ADR
#                                           097/T82 §5. cli reaches it only behind a
#                                           default-off `metastore` feature.)
#   core     -> macros (build-time, opt-in) (the live-pipeline surface; its only
#                                           dependency edge is a BUILD-TIME,
#                                           default-on-`macros`-feature path to the
#                                           proc-macro crate — never a runtime dep,
#                                           `--no-default-features` drops it; the
#                                           runtime dependency set stays empty —
#                                           Stability / ADR 082)
#   macros   -> (none in-workspace)         (proc-macro crate; syn/quote/proc-macro2
#                                           are build-time only, ADR 082)
#   artifact -> (none)                      (the C24 consumption boundary)
# render has NO edge onto core, so it is structurally incapable of reaching the
# pipeline binary (C24). See the ADR for the full rationale.

[workspace]
# resolver = "3" is the edition-2024 default and, more importantly, the
# MSRV-AWARE resolver: it refuses to select a dependency version whose own
# `rust-version` exceeds `[workspace.package].rust-version`, so a transitive
# upgrade cannot silently raise dagr's declared minimum behind our back
# (rust-skills `proj-msrv-declare`; ticket 109 / T94). Declared explicitly rather
# than inherited from the edition so the choice is visible where the MSRV is.
resolver = "3"
members = [
    "crates/core",
    "crates/macros",
    "crates/artifact",
    "crates/render",
    "crates/metastore",
    "crates/cli",
]

# Shared package metadata inherited by every member via `package.<field>.workspace
# = true`. rust-version pins the MSRV at the workspace level (arch.md
# "Stability": MSRV pinned in the workspace) and MUST match the channel in
# rust-toolchain.toml and the "MSRV" line in the README verbatim; bumping it is
# a minor version bump that updates all three together.
#
# The pinned channel IS the MSRV, by design: the pin is what makes the trybuild
# and UI-snapshot diagnostics byte-reproducible across machines, so the declared
# minimum and the pinned toolchain cannot be different numbers. Moving the pin to
# the newest stable therefore moves the declared minimum with it — recorded
# deliberately by ticket 109 (T94), not a side effect.
#
# Six sites carry this pin; `scripts/check-edition-and-msrv-pins.sh` fails the
# build if any of them disagrees.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/athvin/dagr"
authors = ["dagr contributors"]

# Workspace-wide lint policy. Copied verbatim from lints.toml (authored by
# T0.0a as the single source of truth); the human-readable rationale and the
# per-`allow` justification table live in docs/lint-policy.md. Every member
# opts in with `[lints] workspace = true`, so the policy is applied from one
# place. T7 enforces it in CI (clippy -D warnings, rustdoc -D warnings).
[workspace.lints.rust]
warnings = "deny"
missing_docs = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "warn"
collapsible_if = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Build profiles (T93, docs/implementation/108-T93-cargo-profiles.md). Cargo only
# honours `[profile.*]` in the workspace ROOT manifest, so this is the single
# place the decision lives; scripts/check-cargo-profiles.sh fails the build if a
# member manifest grows one (Cargo would silently ignore it) or if any of the
# values below drift. Two settings here are GUARANTEES, not tuning, and are
# commented at the setting rather than in a changelog.

# arch.md "Performance envelope" budgets framework overhead per node — scheduling,
# admission, event writing — at under one millisecond, and holds it with a CI
# benchmark. Cargo's defaults (`lto = false`, `codegen-units = 16`) switch off the
# cross-crate inlining a six-crate workspace with a hot per-node scheduling path
# benefits from most, so that budget was being met with the compiler settings it
# assumes turned off. `lto = "fat"` over `"thin"` is deliberate: dagr is a leaf
# binary built rarely and run repeatedly, so compile time is the cheap side of the
# trade. If CI wall-clock ever becomes the binding constraint, `"thin"` is the
# documented fallback.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# EXPLICIT, never defaulted. dagr contains a task panic with `catch_unwind` and
# reports it as a panicked attempt (a `failed` terminal state), which is only
# possible while panics unwind. `crates/core/src/execution.rs`'s
# `check_panic_strategy` therefore REFUSES to start a run under `panic = "abort"`:
# setting it here would turn every task panic into a process abort and every run
# into a bootstrap refusal. It is written out rather than left to Rust's default
# so a consumer inheriting these settings cannot flip it without deleting a line
# that says why not.
panic = "unwind"
# `strip` is deliberately absent (and absent everywhere else). dagr's pitch is
# explaining a run after the fact, and it attributes a panic to its node through a
# panic hook; stripping symbols trades that away for a binary size dagr does not
# compete on. This is a knowing deviation from the rust-skills
# `perf-release-profile` recommendation, recorded as such in
# docs/rust-skills-register.md.

# A profiled binary needs symbols, so `bench` keeps debuginfo on top of the
# release settings it inherits — otherwise a profile names addresses, not nodes.
[profile.bench]
inherits = "release"
debug = true
strip = false

# Optimize DEPENDENCIES in dev and test builds while leaving dagr's own crates
# unoptimized and fast to rebuild: `package."*"` reaches dependencies only, never
# a workspace member. This one has a measurable consequence — the scale benchmark
# (crates/cli/tests/scale_benchmark.rs) runs under `cargo test`, i.e. this profile,
# so it now measures dagr's scheduling overhead over an optimized tokio instead of
# a debug-mode one.
[profile.dev.package."*"]
opt-level = 3
