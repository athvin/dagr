# dagr-cli — the pipeline binary and its command-line contract.
#
# Role (per the T1 ADR): hosts the standard verbs every pipeline binary shares
# (graph, validate, render, run, single-node, resume, fold, prune — arch.md
# C26) and the typed-parameter plumbing around them. This is the one crate where
# the live pipeline (core), the artifacts (artifact), and rendering (render)
# meet: `render` here is invoked as the pipeline binary's `render` *subcommand*,
# which still consumes artifacts only, so it does not weaken C24.
#
# Dependency direction: cli may depend on core, artifact, and render. Nothing
# depends on cli. The CLI verb logic lands in later tickets (T55, T56); this
# crate is a placeholder lib plus a placeholder bin only.
[package]
name = "dagr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The dagr pipeline binary: the run-loop driver and the command-line contract (run, graph, validate, render, resume, fold, prune)"
documentation = "https://docs.rs/dagr-cli"
readme = "README.md"
keywords = ["dag", "pipeline", "workflow", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools", "asynchronous"]

# --- Publish metadata (T96) ---------------------------------------------------
# `publish = false` is deliberately NOT set here. All six members are intended
# for release: the publish graph is CLOSED, so it is not a per-crate choice —
# Cargo refuses to publish a crate whose dependency (optional or build-time
# included) is not on the registry, so `dagr-core` requires a published
# `dagr-macros` and `dagr-cli` requires a published `dagr-metastore`. Marking
# either unpublishable would make the crates that reach them unpublishable too,
# i.e. the whole workspace. `scripts/check-crate-docs-and-metadata.sh` asserts
# that closure, and that every publishable member carries the full metadata set
# below — so the next crate added cannot skip it.

[lib]
name = "dagr_cli"
path = "src/lib.rs"

[[bin]]
name = "dagr"
path = "src/main.rs"

# The run-a-Flow ergonomics reference driver (ADR 081): runs a real Flow of real
# Tasks through the one-call `RunnableFlow::run` seam — no hand-written NodeRunner.
# It composes only the public library (`dagr_cli::run_flow` + the real `drive`
# loop), adds no dependency, and ships as the demonstration that a task author runs
# a flow without scheduler plumbing (arch.md C1).
[[bin]]
name = "dagr-run-a-flow-demo"
path = "src/bin/dagr-run-a-flow-demo.rs"

# The M4 gate demo run/resume harness (T63) — test-support scaffolding the
# `m4_demo_kill_resume_review` integration test launches and kills. It depends on
# the `test-kit`-gated `dagr_cli::t63_demo` reference pipeline, so it is gated behind
# the same default-on feature: a production `default-features = false` build cleanly
# excludes both. It ships in no released binary.
# The T106 pod-side verb's reference pipeline (`exec-node`) — the process the
# `exec_node_verb_and_shard_writer` suite launches as a subprocess in place of a pod.
# It hosts a real flow of `Payload`-bounded tasks behind the standard registry
# entrypoint, so the verb under test is reached exactly as a real pipeline binary
# reaches it. Gated on `test-kit` (test-support scaffolding) AND `blob` (the verb
# reads and writes a blob store), so a production `default-features = false` build
# excludes it; it ships in no released binary.
[[bin]]
name = "dagr-exec-node-demo"
path = "src/bin/dagr-exec-node-demo.rs"
required-features = ["test-kit", "blob"]

[[bin]]
name = "dagr-t63-demo-run"
path = "src/bin/dagr-t63-demo-run.rs"
required-features = ["test-kit"]

# --- Schema-validation forward (T39/T40), OFF by default ---------------------
# The graph-artifact round-trip test (`tests/graph_artifact_schema_roundtrip.rs`)
# validates a REAL emitted artifact against the published
# `schemas/graph/v1.schema.json` via the T39 helper (`dagr_artifact::schema`).
# That helper — and its CI-/dev-scoped `jsonschema` dependency (T4 ADR 017 §4) —
# sit behind dagr-artifact's `schema-validation` feature (default OFF). This cli
# feature FORWARDS to it, so the validator is pulled ONLY when a caller (CI's
# dedicated step, mirroring T39's) turns it on; the shipped binary and the bare
# `cargo test --workspace` never activate it, which keeps `cargo deny` from seeing
# `jsonschema`'s permissive-but-unlisted transitive licences (no deny.toml change).
[features]
# --- The C28 full-pipeline fakes harness (T62), ON by default ---------------
# `dagr_cli::full_pipeline` — the third C28 testing level (a whole flow of fake
# tasks driven through the REAL T24 `drive` loop against fakes + a tiny fixture,
# deterministically). It ships ON by default so a downstream test can use it with
# no opt-in (mirroring dagr-core's default-on `test-kit` feature for the
# single-task kit, T60), while a production `default-features = false` build can
# still exclude it. It adds NO dependency — it composes already-present library
# entry points (`driver`, `dagr_core::flow`, `dagr_artifact::fold`).
default = ["test-kit", "dag"]
test-kit = []
schema-validation = ["dagr-artifact/schema-validation"]

# --- The M6 declarative-DAG auto-discovery feature (T79), ON by default ------
# `dag` turns on `inventory`-backed DAG discovery: the `DagRegistration` collected
# record type, the single `inventory::collect!`, and the `dagr_cli::run(argv)`
# auto-discovery entrypoint (ADR 092). `inventory` is a RUNTIME dependency, so it is
# confined to `dagr-cli` behind this OPTIONAL feature and never reaches `dagr-core`
# (core's zero-runtime-dependency guarantee, ADR 081/082) — exactly as
# `--no-default-features` drops `dagr-macros` from core. A production
# `default-features = false` build of `dagr-cli` therefore has NO `inventory`
# dependency edge and none of the `DagRegistration` / `run` items. It ships ON by
# default so the one-line `fn main() { dagr_cli::run(env::args_os()) }` and the
# `#[dag]` re-export (T80) work with no opt-in.
dag = ["dep:inventory"]

# --- The M7 run-index feature (T83, ADR 097), OFF by default -----------------
# `metastore` turns on the `dagr metastore init` verb and the optional
# `dagr-metastore` dependency edge (the libSQL/SQLite run index). It is DEFAULT-OFF
# — the inverse of the default-on `dag` feature — because `libsql` is heavy and
# pre-1.0 (a C fork pulling a bindgen/clang toolchain): a plain `cargo build --all`
# and `cargo build -p dagr-cli --no-default-features` must pull NEITHER `libsql`
# NOR `dagr-metastore`, keeping `dagr-core`'s zero-runtime-dependency guarantee
# untouched (ADR 097 §5; proved by `scripts/check-metastore-feature-gating.sh` and
# `cargo build --all --no-default-features`). The verb wiring in `src/main.rs` is
# gated behind `#[cfg(feature = "metastore")]`, so a default binary has no
# `metastore` verb. `dagr-metastore` depends only on `dagr-artifact` + `libsql` +
# `tokio` and has NO path to `dagr-core`.
metastore = ["dep:dagr-metastore"]

# --- The M10 blob-storage feature (T104, ADR 115 §8), OFF by default ---------
# `blob` turns on the optional `dagr-blob` dependency edge (the blob port + its
# local filesystem backend) and, with it, `dagr_cli::blob_bridge` — the
# `Blob<T>` durable-output bridge over `dagr_core::Payload`. It is DEFAULT-OFF,
# like `metastore`: a pipeline that stores nothing pays for nothing, and a plain
# `cargo build --all` / `cargo build -p dagr-cli --no-default-features` reaches
# no storage backend through the binary.
#
# `dagr-blob` itself has NO dependencies at all (its SHA-256 content address is
# in-tree), so unlike the metastore feature this one adds no third-party crate to
# any resolution — the gating is about SURFACE (the bridge, the `Blob<T>` type),
# not about keeping a heavy tree out. The bridge lives HERE rather than in
# `dagr-blob` because it needs both `DurableOutput` and `Payload`, which are
# `dagr-core`'s, and `dagr-blob` must keep its no-edge-onto-core boundary
# (`scripts/check-blob-feature-gating.sh` asserts both halves).
blob = ["dep:dagr-blob"]

# --- The M10 object-store client feature (T110), OFF by default --------------
# `blob-s3` turns on `dagr_cli::blob_s3` — the HTTPS transport the object-store
# backend's sans-IO protocol is executed over — and with it the ONLY network
# dependency M10's storage half adds.
#
# The split is the point. `dagr-blob` holds the whole S3 protocol (canonical
# requests, SigV4 signing over its in-tree SHA-256/HMAC, status classification,
# paged listing, the bounded retry) with an EMPTY dependency table, so
# `cargo build --all` compiles the backend and no HTTP or TLS crate. This feature
# adds the socket, and only the socket:
#
#   * `cargo build --all`, `cargo build -p dagr-cli --no-default-features` and
#     even `cargo build -p dagr-cli --features blob` compile NO HTTP/TLS crate —
#     the same containment `dagr-k8s`'s `client` feature keeps, and stronger than
#     the metastore's (whose libsql is unconditional in its own crate).
#   * `dagr-core` is untouched at every feature setting.
#
# It implies `blob`, because a transport with no port to serve is nothing.
#
# The dependency set is three crates and was chosen against the licence budget:
# every transitive licence resolves into deny.toml's existing allow-list, so this
# feature adds NO new SPDX id (the same finding T107 recorded for the Kubernetes
# client). `rustls`, `ring`, `httparse`, `http` and most of the rest are already
# in the lockfile via that client; `ureq` and `rustls-native-certs` are the new
# names. `webpki-roots` is deliberately NOT used — its CA bundle is
# CDLA-Permissive-2.0, an id the allow-list does not carry — which is why roots
# come from the platform trust store instead.
blob-s3 = ["blob", "dep:ureq", "dep:rustls", "dep:rustls-native-certs"]

# --- The M10 shared-pod-observer feature (T107, ADR 115 §2/§4), OFF by default -
# `k8s` turns on the optional `dagr-k8s` dependency edge — the shared pod
# observer, its reconnect discipline, and the label/annotation identity encoding
# — WITH that crate's own `client` feature, which is where the Kubernetes client
# and its whole HTTP/TLS tree live.
#
# It is DEFAULT-OFF, like `metastore` and `blob`, and the containment is the
# strongest of the three: the client sits behind a default-off feature INSIDE
# `dagr-k8s` as well, so `cargo build --all` and
# `cargo build -p dagr-cli --no-default-features` compile NO HTTP or TLS crate at
# all — not merely none reachable through the cli. That matters because a
# Kubernetes client roughly doubles the lockfile and pulls a C toolchain for its
# TLS backend, and a contributor who never touches remote execution should never
# build it.
#
# `default-features = false` on the edge below is deliberate too: it drops
# `dagr-k8s`'s default-on `test-kit` feature, so the fake API surface the
# observer's suites drive never ships in a pipeline binary.
#
# The EXECUTOR that submits pods and consumes this observer is not here yet — the
# `k8s` executor is still the recognized stub `crates/cli/src/executor.rs`
# refuses. This feature ships the observer and the boundary around it; the runner
# arrives with the ticket that stub names.
#
# `tokio/macros` rides with it, and only with it: the observer task is a
# `select!` between its command inbox and its watch (with the stall bound as the
# other arm), which is the one place in this crate that needs the macro. The
# default surface keeps tokio's minimal feature set — the driver still builds its
# runtimes by hand and there is still no `#[tokio::main]`.
#
# It also turns `blob` on (T108). That is not a convenience: a remote attempt
# reports through an attempt shard whose address IS a blob-container path, and it
# returns its output as a blob reference — so `k8s` without `blob` describes an
# executor that can submit a pod and can never learn what the pod did. Making the
# dependency explicit here keeps it out of every caller's feature list and out of
# CI's, and `blob` remains independently selectable for the local durable path.
k8s = ["dep:dagr-k8s", "tokio/macros", "blob"]

[dependencies]
dagr-core = { path = "../core", version = "0.0.0" }
dagr-artifact = { path = "../artifact", version = "0.0.0" }
dagr-render = { path = "../render", version = "0.0.0" }

# dagr-metastore — the OPTIONAL M7 run-index crate (T83, ADR 097), pulled ONLY
# behind the default-off `metastore` feature above. `optional = true` means the
# edge exists only when the feature is on, so `cargo build --all` and
# `--no-default-features` build `dagr-cli` with NO edge onto `dagr-metastore` (and
# therefore none onto `libsql`), and `dagr-core` never sees either — exactly as the
# `dag` feature confines `inventory`. It is a normal workspace member, so
# `cargo test --workspace` still builds it directly; this edge is what the cli
# reaches it through, and only under the feature.
dagr-metastore = { path = "../metastore", version = "0.0.0", optional = true }

# dagr-blob — the OPTIONAL M10 blob-storage crate (T104, ADR 115 §8), pulled ONLY
# behind the default-off `blob` feature above. `optional = true` means the edge
# exists only when the feature is on, so `cargo build --all` and
# `--no-default-features` build `dagr-cli` with NO edge onto `dagr-blob`, and
# `dagr-core` never sees it. It is a normal workspace member, so
# `cargo test --workspace` still builds and tests it directly; this edge is what
# the cli reaches it through, and only under the feature.
#
# `default-features = false` drops the crate's default-on `test-kit` feature — the
# in-process S3-compatible fixture the backend's suites drive — so it never ships
# in a pipeline binary. The dev-dependency below takes it WITH the fixture, which
# is how this crate's own suites reach it (the same shape the `dagr-k8s` edges
# use).
dagr-blob = { path = "../blob", version = "0.0.0", optional = true, default-features = false }

# dagr-k8s — the OPTIONAL M10 shared-pod-observer crate (T107, ADR 115 §2/§4),
# pulled ONLY behind the default-off `k8s` feature above, and with
# `default-features = false` so the fake API surface stays out of a pipeline
# binary. `features = ["client"]` is what turns the Kubernetes client on: without
# it the crate compiles to the observer, the port, the identity encoding and the
# cluster-access resolution, and no HTTP or TLS crate is compiled anywhere in the
# workspace. It is a normal workspace member, so `cargo test --workspace` still
# builds and tests its client-free surface directly; this edge is what the cli
# reaches it through, and only under the feature.
dagr-k8s = { path = "../k8s", version = "0.0.0", optional = true, default-features = false, features = [
    "client",
] }

# dagr-macros — the build-time-only, zero-runtime-dependency proc-macro crate (ADR
# 082/092). dagr-cli depends on it for the M6 `#[dag]` attribute (T80), which it
# re-exports behind `#[cfg(feature = "dag")]` (`pub use dagr_macros::dag;`), exactly
# as dagr-core re-exports `#[task]` behind its `macros` feature. A proc-macro runs
# INSIDE the compiler and is never linked into the shipped binary, so this second edge
# onto the leaf proc-macro crate adds NO runtime dependency and no cycle is possible
# (dagr-macros has no dependency on dagr-cli). The `#[dag]` expansion targets
# `::dagr_cli::…` / `::inventory::…` items — resolved in the leaf binary's own
# dependency graph — so it needs no dependency edge here beyond this one. It is an
# UNCONDITIONAL dependency (not behind the `dag` feature): the re-export is gated, but
# pulling the build-time crate costs nothing at runtime, mirroring dagr-core's default-on
# `macros` feature; a `--no-default-features` build simply drops the `pub use`.
dagr-macros = { path = "../macros", version = "0.0.0" }

# clap — the C26 command-line contract's argument parser (T55). The pipeline
# declares a typed parameter surface and the library *derives* the verb/flag
# parsing (arch.md C26: "the library derives the parsing"); clap's derive is the
# idiomatic expression of that seam, and it owns the reserved library-flag
# namespace so a pipeline parameter can never shadow a library-owned flag. It is
# added to dagr-cli — the pipeline binary that owns the CLI contract — NOT
# dagr-core, so core stays dependency-free (Stability / the T1 ADR). The feature
# set is kept minimal: `std` + `derive` + `help` + `usage` + `error-context`.
# `color`, `suggestions` (strsim), `wrap_help` (terminal_size), `env`, and
# `unicode` are DELIBERATELY OFF so `--help`/usage output is deterministic — no
# terminal-width- or TTY-dependent formatting, a C26/Determinism requirement —
# and the transitive tree stays small. The whole transitive addition (clap,
# clap_builder, clap_lex, clap_derive, anstyle, anstyle-parse, anstyle-query,
# anstream, colorchoice, is_terminal_polyfill, once_cell_polyfill, utf8parse,
# heck; proc-macro2/quote/syn/unicode-ident were already present via
# serde_derive) resolves to MIT under the MIT-only deny.toml — the sole non-MIT
# id, unicode-ident's `Unicode-3.0`, is ALREADY allowed (added by T19). NO
# deny.toml change is needed; `cargo deny`/`cargo audit` stay green.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# serde_json — the T4-sanctioned (017) runtime serialization stack. The C20
# graph-artifact emitter (T40, `src/graph.rs`) builds the artifact as a
# `serde_json::Value` and serializes it through dagr-artifact's shared T4 §6
# canonicalizer (`dagr_artifact::canonical`). serde_json is the ADR's named
# runtime writer ("The runtime writers depend only on `serde` + `serde_json`");
# it is MIT, already resolved in the tree via dagr-artifact, and adds no new
# advisory/license surface. It moves from a dev-dependency to a direct dependency
# because the emitter is production code, not a test. The `jsonschema` validator
# stays CI-/dev-scoped (behind dagr-artifact's `schema-validation` feature),
# enabled only by the round-trip tests — the emitter itself never pulls it.
serde_json = "1"

# tokio — the async runtime the T2 ADR (004) commits to. The M1 run-loop driver
# (T24) needs exactly two capabilities beyond bare futures, so the feature set is
# kept minimal (NOT `full`, per the ticket's supply-chain constraint):
#   * rt-multi-thread — the driver builds TWO multi-threaded runtimes: an isolated
#     `framework` runtime (the loop, per-attempt timers, event writer — T2's
#     isolated framework runtime) and a separate `tasks` runtime attempts spawn
#     onto, so a task jamming every task worker cannot stall the framework runtime
#     (the all-workers-blocked scenario). `rt` is implied by `rt-multi-thread`.
#   * time — the per-attempt timeout deadline future and the bounded zombie grace
#     wait at natural run end (C16) are `tokio::time` sleeps armed on the isolated
#     runtime, so they fire even when task workers are saturated.
#   * sync — the framework loop receives each finished attempt's terminal state
#     and buffered event records over a `tokio::sync::mpsc` channel (the hand-off
#     from a spawned attempt back to the single-owner event writer), and awaits it
#     without blocking the framework runtime.
# `signal` is added by T36 (046): the C16 OS-signal handlers wiring SIGTERM/SIGINT
# to the T35 `CancelHandle` seam use `tokio::signal::unix::{signal, SignalKind}`,
# which reuses the runtimes and channels already built rather than adding a new
# crate like `ctrlc`/`signal-hook`. On unix, tokio's `signal` feature transitively
# pulls `mio` (for the async signal-driver notify pipe) and `signal-hook-registry`
# (the safe async-signal-safe handler registry) plus `libc` — all MIT OR Apache-2.0
# (resolved to MIT; no deny.toml change needed). `macros`, `net`, `fs`, and
# `process` remain omitted: the driver builds its runtimes by hand (no
# `#[tokio::main]`) and does no I/O of its own (the sink is injected — T0.6).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "signal"] }

# rayon — the dedicated compute pool the T2 ADR (004 §3) chose over a capped
# semaphore over `spawn_blocking`: a `rayon::ThreadPool` built with `num_threads(N)`
# runs at most N closures concurrently regardless of how many are submitted, so
# C13's "concurrently executing compute-class tasks never exceed the compute pool's
# size" is *structural in the pool* rather than resting on a correctly-held
# semaphore, and the blocking pool stays free for genuinely I/O-waiting work.
# Execution-class DISPATCH (T33) is where the ADR said this dependency lands; it is
# added to dagr-cli (which owns the driver/dispatch), NOT dagr-core, so core stays
# pure (Stability / T1). The default features are the work-stealing thread pool
# this needs; rayon's tree (rayon-core, crossbeam-*, either) is MIT OR Apache-2.0.
rayon = "1"

# tracing + tracing-subscriber — the C25 logging/tracing integration (T45, 056).
# arch.md C25 makes tracing a *named public integration*, not the cfg-gated
# optional dep dagx used: every attempt runs beneath a span carrying run/node/
# attempt identity so any line — framework or third-party the task calls — is
# attributable without correlating timestamps, with a structured-by-default and a
# human-readable output mode switchable by an environment variable (no recompile).
# It is added to dagr-cli — the pipeline binary that owns bootstrap and the run
# loop where attempts execute — NOT dagr-core, so core stays dependency-free
# (Stability / the T1 ADR): core exposes only the dep-free `LogSpan` identity
# payload on the `RunContext`; the subscriber install and the span wiring live
# here (`src/logging.rs`) and the driver instruments each attempt future with the
# span. The C25 tracing layer is the developer/operator observability surface and
# is deliberately DISTINCT from the C19 durable event stream (the authoritative
# record): a tracing line is not an event-stream record and never replaces one.
#   * tracing — the facade the framework and third-party libraries emit through;
#     `Span`/`Instrument` carry the attempt identity across `.await` points.
#   * tracing-subscriber with default-features OFF and only `fmt` + `json` + `std`:
#     `fmt` gives the human-readable local-dev layer, `json` the structured
#     machine-queryable default (run/node/attempt as discrete fields). `env-filter`
#     is deliberately NOT enabled — the mode env var selects the *format*, a level
#     cap is set directly — which keeps `matchers`/`regex`/`nu-ansi-term`/`smallvec`
#     out of the tree. The whole transitive addition (tracing, tracing-core,
#     tracing-attributes, tracing-serde, sharded-slab, thread_local, once_cell,
#     pin-project-lite; serde/serde_json/memchr were already present) resolves to
#     MIT under the MIT-only deny.toml — NO deny.toml change is needed, and
#     `cargo audit`/`cargo deny` stay green.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

# toml — the ADR 128 (T113/T115) `dagr.toml` parser: the runtime-knob
# configuration file with named profiles, read at BOOTSTRAP only and resolved as
# the fourth precedence tier (`flag > env > file(profile) > default`,
# `src/config_file.rs`). It is added to dagr-cli — the crate that already owns
# every other config surface (flags, `DAGR_*`) — NEVER dagr-core, which reads no
# file exactly as it reads no environment (ADR 128 §6); check-feature-matrix.sh
# asserts `toml` is unreachable from dagr-core at every feature setting. Version
# `1` is the same resolution `trybuild` (a dev-dependency of the trybuild
# suites) already locked, so no second `toml` enters the graph.
# `default-features = false` + `parse`/`serde`/`std` takes the deserializer half
# only — `Table: FromStr` — and the loader then walks `toml::Value`s BY HAND for
# loud unknown-key/wrong-type diagnostics: no serde *derive* is involved and the
# `display` (writer) half stays out. The transitive addition (toml, toml_parser,
# toml_datetime, serde_spanned, winnow; serde_core arrives with the serde
# already in this tree) is `MIT OR Apache-2.0` throughout, resolved to MIT under
# the MIT-only deny.toml — NO new licence id, NO deny.toml change; `cargo deny`/
# `cargo audit` stay green.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# inventory — the M6 `dag`-feature link-time DAG registry (ADR 092, T79). `#[dag]`
# (T80) emits an `inventory::submit!` of a `{ name, factory }` record and
# `dagr_cli::run` iterates `inventory::iter` to build a `FlowRegistry`; T79 builds
# the discovery mechanism against hand-written `submit!`s. `inventory` registers
# life-before-`main` constructors in a linker section, so a submission is reliably
# collected only in the final linked binary — hence ADR 092's leaf-binary contract
# (DAGs live in the binary crate). It is the FIRST runtime dependency outside the
# already-vetted clap/tokio/rayon/tracing/serde set, so it is OPTIONAL and pulled
# ONLY by the default-on `dag` feature (`dag = ["dep:inventory"]`), keeping it out of
# a `--no-default-features` build and away from `dagr-core` entirely. It is
# `MIT OR Apache-2.0` (MIT-resolved) with no transitive runtime deps, so it needs no
# `deny.toml` change — `cargo deny`/`cargo audit` stay green (a DoD check because it
# is the first dependency added since that set was vetted).
inventory = { version = "0.3", optional = true }

# --- The quarantined object-store client tree (behind `blob-s3`, T110) --------
# ureq — a synchronous HTTP client, which is what the blob port needs: `put` /
# `get` / `head` are blocking calls (the local backend already pays two fsyncs on
# the caller's thread), so an async client would mean a `block_on` inside a
# synchronous trait method — a deadlock waiting for the first caller that is
# already on a runtime. `default-features = false` + `rustls-no-provider` takes
# the request path and rustls WITHOUT `webpki-roots`, whose bundled CA list is
# CDLA-Permissive-2.0 and would be the only new SPDX id this whole feature needed;
# roots come from the platform trust store instead (see `rustls-native-certs`).
# `gzip` is off: object bodies are opaque content-addressed bytes and a transfer
# encoding that rewrote them would break the digest check that verifies them.
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
], optional = true }

# rustls — the TLS backend, pinned to the same `ring` provider `dagr-k8s` uses so
# one process installing both features has one provider, not a conflict. It is
# named here (rather than left to ureq) for T101's build trap 2: rustls 0.23 does
# not install a process-level crypto provider by itself and PANICS on the first
# handshake if none was chosen, and a panic on first use is not an acceptable
# failure mode for an opt-in feature. `dagr_cli::blob_s3` installs it explicitly.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }

# rustls-native-certs — the platform trust store, instead of a bundled CA list.
# Two reasons, in order: an operator's private CA (the normal case for an
# in-cluster MinIO or gateway) then works by being trusted where everything else
# on the host trusts it, with no dagr-specific configuration; and it keeps the
# licence surface inside deny.toml's existing allow-list. `Apache-2.0 OR ISC OR
# MIT`, and its platform tree (openssl-probe, security-framework, schannel)
# resolves the same way.
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
# dagr-blob WITH its default-on `test-kit` feature — the in-process
# S3-compatible fixture (`dagr_blob::s3::fake::FakeS3`) the object-store suites
# drive. An unreachable store, a bounded run of failures, a specific status and an
# object overwritten out-of-band are all inducible there and none of them is
# inducible against a real endpoint.
#
# It is NOT optional, because Cargo forbids optional dev-dependencies, and it does
# not need to be: a dev-dependency is absent from `cargo tree -e normal` at every
# feature setting, so the default and `--no-default-features` RUNTIME resolutions
# are untouched, and `default-features = false` on the shipping edge above still
# keeps the fixture out of a pipeline binary. It pulls no third-party crate — this
# crate has none — so it costs the test build nothing. The suites themselves are
# behind `#![cfg(feature = "blob")]`, so a default `cargo test -p dagr-cli` skips
# them. (The same shape the `dagr-k8s` dev-dependency below uses, for the same
# reason.)
dagr-blob = { path = "../blob", version = "0.0.0" }

# trybuild — the `FlowBuilder` façade's compile-time safety corpus (T78,
# tests/flow_builder_compile_fail.rs). The façade returns the real `Handle<T>` and
# forwards to the stable-name-aware registrars, so its guarantees (wrong-type
# wiring is a compile error, a `StableName`-less task cannot use the graph-emittable
# `source`, no `run`/`into_pipeline` on the façade) are inherited from the engine and
# must be *pinned* — a red build if any regresses. `trybuild` matches `.stderr`
# byte-exactly under the workspace-pinned toolchain, which is exactly what pins those
# diagnostics; it is a DEV-dependency only, so the shipped `dagr-cli` library and
# binary never see it. Its transitive tree
# (serde/serde_json/toml/glob/termcolor/unicode-ident) resolves to MIT + Unicode-3.0,
# both already allowed in `deny.toml` (unicode-ident is already a build-time dep of
# serde_derive), so it adds NO new licence surface — `cargo deny`/`cargo audit` stay
# green. It is already a dev-dependency of `dagr-macros`, so it is in the lockfile.
trybuild = "1"

# dagr-k8s WITH its default-on `test-kit` feature — the in-process fake API
# surface (T107). The pod-observer task in `src/pod_observer.rs` is driven against
# it under a paused clock: an in-stream 410, a silent stall, a duplicate delivery
# and a permanently broken watch are all inducible there and none of them is
# inducible against a cluster.
#
# It is NOT optional, because Cargo forbids optional dev-dependencies, and it does
# not need to be: a dev-dependency is absent from `cargo tree -e normal` at every
# feature setting, so the default and `--no-default-features` RUNTIME resolutions
# are untouched, and `default-features = false` on the shipping edge above still
# keeps the fake out of a pipeline binary. `client` is off here, so this edge
# compiles no HTTP or TLS crate; the suites themselves are behind
# `#![cfg(feature = "k8s")]`, so a default `cargo test -p dagr-cli` skips them.
dagr-k8s = { path = "../k8s", version = "0.0.0" }

# tokio's `test-util` gives the paused clock, and `macros` gives `#[tokio::test]`.
# The pod-observer suites' whole subject is timing — a 90-second stall bound, an
# exponential reconnect backoff, a shutdown budget — and a suite that slept
# through those would be both slow and flaky. With `start_paused = true` they
# assert the SCHEDULE rather than race it, in microseconds. A dev-dependency's
# features reach the test build only, so the shipped library and binary keep the
# minimal feature set documented above.
tokio = { version = "1", default-features = false, features = ["macros", "test-util"] }

# libc — T36 (046) only. The C16 signal test proves the *end-to-end* OS-signal
# path without killing the test-runner by `fork`ing a controlled child that
# `raise`s SIGTERM/SIGINT at ITSELF and asserting the child took the cancellation
# exit path. That needs raw `fork`/`raise`/`waitpid` and the `WIF*` macros, which
# only `libc` exposes; it is a dev-dependency (test-only), already in the tree via
# tokio's `signal` feature and rayon, and MIT OR Apache-2.0. The child harness is
# `#[cfg(unix)]`; on non-unix the end-to-end path is documented as a no-op and the
# wiring is covered through the programmatic seam + routing unit tests instead.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
