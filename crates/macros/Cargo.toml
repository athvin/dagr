# dagr-macros — the OPTIONAL proc-macro authoring layer (ADR 082).
#
# Role (per ADR 082, docs/implementation/082-task-macro-adr.md): a build-time-only
# proc-macro crate exporting the `#[task]` attribute, which expands an inherent
# `impl` block into the exact `impl Task for Foo { … }` an author writes by hand
# today. It is a purely ADDITIVE, opt-in ergonomic layer over dagr-core's C1 task
# abstraction — hand-written `impl Task` stays the first-class, zero-dependency
# escape hatch.
#
# Zero-runtime-dependency guarantee (ADR 081, preserved by ADR 082). This crate's
# only dependencies are the build-time `syn` / `quote` / `proc-macro2`; a
# proc-macro runs INSIDE the compiler and is NEVER linked into the shipped binary.
# dagr-core depends on dagr-macros only behind its default-on `macros` feature,
# and the macro's expansion references only existing dagr-core items, so a
# produced program's RUNTIME dependency graph is byte-for-byte unchanged. This is
# proved by `cargo build --all --no-default-features`, which builds core with no
# dependency edge onto dagr-macros at all (a T71 DoD check).
[package]
name = "dagr-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "dagr_macros"
# A proc-macro crate: its public surface is attribute/derive macros only, and it
# is loaded by the compiler, not linked into the runtime binary.
proc-macro = true

[dependencies]
# The three build-time proc-macro crates — and NOTHING else (no runtime deps).
# Versions are pinned to the entries already resolved in the workspace lockfile
# (added by serde_derive / clap via proc-macro2/syn), so this crate adds no NEW
# crate to the dependency tree and no new licence surface: all three are MIT,
# already allowed by deny.toml. `syn` uses the "full" feature to parse whole
# `impl` blocks (items, not just expressions).
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# --- Dev-only: the trybuild accept/reject corpus (T73, tests/trybuild.rs) -----
#
# The macro's expansion targets `dagr-core` items (`Task`, `RunContext`,
# `TaskError`, the `#[task]` re-export) and the multi-input deps mismatch is a
# `dagr-cli::run_flow::RunnableFlow` seam check, so the compile-pass/compile-fail
# fixtures need both crates on their path — as DEV-dependencies only, so nothing
# here touches the shipped proc-macro's dependency graph.
#
# This forms a DEV-dependency cycle (`dagr-core` depends on `dagr-macros` behind
# its `macros` feature; the fixtures here depend back on `dagr-core`/`dagr-cli`).
# Cargo permits dev-dependency cycles — a dev-dep is used only to build this
# crate's own test targets, never its library — so the cycle is legal and does
# not affect the normal (non-dev) build order.
#
# `trybuild` pins the macro's accept/reject boundary with byte-exact `.stderr`
# snapshots under the workspace-pinned toolchain. Its transitive tree
# (`serde`/`serde_json`/`toml`/`glob`/`termcolor`/`unicode-ident`) resolves to
# MIT + Unicode-3.0, both already allowed in `deny.toml`, so it adds no new
# licence surface (`unicode-ident` is already a build-time dep of `serde_derive`).
[dev-dependencies]
trybuild = "1"
# `default-features = false` off `dagr-core` is deliberately NOT set: the fixtures
# author tasks with `#[task]`, which is the `macros` feature (default-on).
dagr-core = { path = "../core" }
dagr-cli = { path = "../cli" }
# inventory — a dev-dependency ONLY for the `#[dag]` trybuild corpus (T81). `#[dag]`
# expands to `::inventory::submit! { … }`, which `$crate`-resolves `inventory` in the
# CALLER's extern prelude (ADR 092, no path override). A `#[dag]` fixture that reaches
# full expansion (the bad-fn-signature case — grammar-error fixtures short-circuit
# before expansion) therefore needs `inventory` in this test crate's prelude, exactly
# as the leaf-binary contract requires an app crate to depend on `inventory = "0.3"`.
# Without it the fixture's `.stderr` would carry a spurious "cannot find `inventory`"
# error instead of the clean bad-signature diagnostic the corpus is pinning. It is
# test-only (never in the shipped proc-macro's dependency graph), already in the
# lockfile via `dagr-cli`'s default-on `dag` feature, and `MIT OR Apache-2.0`
# (MIT-resolved) — no new licence surface, no `deny.toml` change.
inventory = "0.3"

[lints]
workspace = true
