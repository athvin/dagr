# dagr-core — the execution core (the live pipeline surface).
#
# Role (per the T1 ADR): holds the authoring surface and execution core — the
# code that *is* the running pipeline. This is the crate whose dependency set
# arch.md "Stability" commits to keeping minimal and review-gated; it is empty
# here (a skeleton) and every future addition is an API decision.
#
# Dependency direction: core's ONLY workspace dependency is a build-time,
# default-on-`macros`-feature, OPTIONAL path edge onto dagr-macros (the `#[task]`
# proc-macro, ADR 082). A proc-macro runs inside the compiler and is never linked
# into the shipped binary, so core's RUNTIME dependency set stays empty and
# `--no-default-features` drops the edge entirely (proved by `cargo build --all
# --no-default-features`). render must never gain a dependency edge onto core
# (C24).
[package]
name = "dagr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The dagr execution core: the authoring surface and run loop that make one compiled Rust binary a DAG pipeline"
documentation = "https://docs.rs/dagr-core"
readme = "README.md"
keywords = ["dag", "pipeline", "workflow", "dataflow", "task"]
categories = ["concurrency", "asynchronous", "development-tools"]

# --- Publish metadata (T96) ---------------------------------------------------
# `publish = false` is deliberately NOT set here. All six members are intended
# for release: the publish graph is CLOSED, so it is not a per-crate choice —
# Cargo refuses to publish a crate whose dependency (optional or build-time
# included) is not on the registry, so `dagr-core` requires a published
# `dagr-macros` and `dagr-cli` requires a published `dagr-metastore`. Marking
# either unpublishable would make the crates that reach them unpublishable too,
# i.e. the whole workspace. `scripts/check-crate-docs-and-metadata.sh` asserts
# that closure, and that every publishable member carries the full metadata set
# below — so the next crate added cannot skip it.

[lib]
name = "dagr_core"
path = "src/lib.rs"

[dependencies]
# dagr-macros — the OPTIONAL `#[task]` proc-macro (ADR 082), pulled ONLY behind
# the default-on `macros` feature below. `optional = true` means the dependency
# edge exists only when the feature is on, so `--no-default-features` builds core
# with no edge onto dagr-macros at all. A proc-macro is a build-time compiler
# plugin, never linked into the runtime binary, so this adds ZERO runtime
# dependency — core's zero-runtime-dependency guarantee (ADR 081) is preserved.
dagr-macros = { path = "../macros", version = "0.0.0", optional = true }

[features]
# The C28 single-task test kit (ticket T60) — a shipped testing utility
# downstream test code calls to exercise ONE task in isolation with a hand-built
# RunContext (C8) and fake resources (C9). Enabled by default so the kit is part
# of the default `--workspace` test/clippy/doc surface (and its behavioral tests
# run under `cargo test --workspace`), but factored behind its own feature so a
# production build can `default-features = false` to exclude it. It adds NO
# dependency and NO production runtime behavior — it is inert constructor/driver
# code reachable only when test code calls it.
#
# The `macros` feature (ADR 082 / T71): re-exports the optional `#[task]`
# proc-macro as `dagr_core::task`, so `use dagr_core::task;` resolves the
# attribute. ON by default so the ergonomic authoring layer is available out of
# the box; `default-features = false` (or explicitly disabling `macros`) drops
# the dagr-macros dependency edge entirely, keeping the zero-runtime-dependency
# guarantee provable via `cargo build --all --no-default-features`.
default = ["test-kit", "macros"]
test-kit = []
macros = ["dep:dagr-macros"]

[lints]
workspace = true
