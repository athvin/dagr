# dagr workspace lint policy — machine-readable form.
#
# WARNINGS-DENIED POSTURE. dagr's pitch is compile-time confidence
# (arch.md "What this is", "Stability"): "clippy with warnings denied" is a
# shared contract, not a per-developer habit. This file is the single source of
# truth for that contract; the human-readable rationale, including a one-line
# justification for every `allow` exception, lives in docs/lint-policy.md.
#
# HOW THIS IS APPLIED (do not wire here — that is T1/T7):
#   * T1 copies these tables into the workspace manifest under
#     `[workspace.lints]` and each crate opts in with `[lints] workspace = true`,
#     so the policy is inherited workspace-wide from one place.
#   * T7 enforces it in CI via `cargo clippy --workspace --all-targets
#     -- -D warnings` and `cargo doc` with `-D warnings` (rustdoc lint).
# This ticket authors the POLICY only; it introduces no Cargo.toml (workspace
# is T1).
#
# The table layout below is exactly the shape a `[workspace.lints]` table takes
# (`rust`, `clippy`, `rustdoc` sub-tables), so T1's inheritance is a copy, not a
# translation.

[rust]
# Compiler warnings are hard errors in CI; nothing ships with a warning.
warnings = "deny"
# Public-item rustdoc (arch.md "Documentation": rustdoc on every public item,
# enforced by lint in CI). `missing_docs` is ALLOW-by-default in rustc, so `warn`
# is what switches it on and `warnings = "deny"` then promotes it — it has been
# effectively denied for the whole life of the workspace. T96 writes the level out
# so the deny is readable AT the setting instead of derived two lines up, and
# retires the "kept at warn pre-workspace so scaffolding crates in T1 are not
# blocked" note, which stopped being true when T1 shipped.
missing_docs = "deny"
# Cfg-typo insurance (T98). `#[cfg(feature = "metastor")]` is not an error — it is
# a condition that is simply never true, so the code under it compiles into
# nothing and the feature it was meant to gate silently does not exist. dagr gates
# three architectural guarantees on features, which makes that failure mode
# expensive and invisible in exactly the place it can least afford to be.
# `unexpected_cfgs` is warn-by-default and `warnings = "deny"` has been promoting
# it all along; writing the level out makes the guarantee readable AT the setting
# and independent of that promotion. `check-cfg` states dagr's CUSTOM cfg surface,
# which is EMPTY — every `cfg` in the workspace is either a feature (cargo declares
# those itself) or a well-known name (`unix`, `test`, `doc`, `panic`). It is
# written out rather than omitted so the next custom cfg — `cfg(loom)`, say, if the
# declined loom port is ever revisited — has to be declared HERE to compile, which
# is the whole point of the mechanism.
unexpected_cfgs = { level = "deny", check-cfg = [] }
unsafe_code = "warn"       # dagr targets safe Rust; each use is reviewed (see rationale).

[clippy]
# Deny the standard clippy lint groups. `all` = correctness + suspicious +
# style + complexity + perf; `pedantic` catches API and clarity issues that
# matter for a library whose types must read from the declaration (arch.md C1).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Allowed exceptions — every one carries a one-line rationale in
# docs/lint-processing.md's exception table. Priority 0 lets these override the
# group-level deny above.
module_name_repetitions = "allow"   # dagr's C-numbered modules read fine repeated.
# Every fallible public fn documents what its `Result` means. Like `missing_docs`
# above this was already effectively denied by `warnings = "deny"`; the deferral
# it carried ("until the error taxonomy (T3) lands") expired when T3 shipped, and
# T95's audit found ZERO missing sections — so this ratchet costs nothing today
# and is what keeps that true.
missing_errors_doc = "deny"
# Under edition 2024 (T94) let-chains are available, so clippy's `collapsible_if`
# fix for `if let A { if let B { .. } }` becomes `if let A && let B` — i.e. the lint
# now demands LET-CHAIN ADOPTION at 25 sites. T94's Out of scope defers that
# adoption to ordinary future work (docs/rust-skills-register.md,
# `pat-if-let-chains`), so the lint is allowed until a ticket owns it; re-denying it
# is how that ticket will find its work list.
collapsible_if = "allow"
# Every `unsafe` block and `unsafe impl` must carry a `// SAFETY:` comment
# (rust-skills `lint-unsafe-doc`, adopted by T95). dagr targets safe Rust and its
# `unsafe` surface is a single `GlobalAlloc` impl, so the convention was already
# universal — denying it makes it mechanical instead of a review habit, which is
# the point: the next `unsafe` block cannot land without stating why it is sound.
undocumented_unsafe_blocks = "deny"
# No lock guard may be alive across a suspension point (rust-skills
# `anti-lock-across-await` / `async-no-lock-await`, adopted by T97). dagr denies
# `clippy::all`, which already IMPLIES this lint — which is why the workspace has
# been green under it since the driver was written — but an implied deny lasts only
# as long as upstream keeps the lint in that group. Writing it out at priority 0
# makes the guarantee independent of clippy's grouping, and makes the intent
# readable at the setting (the same ratchet T96 applied to `missing_docs`). This is
# the ONE mechanical check standing behind dagr's async discipline: an `allow` here
# would defeat it, so a guard that must span an await needs a scoped, justified
# exception at the site instead.
await_holding_lock = "deny"

[rustdoc]
# Broken intra-doc links fail the docs job (arch.md "Documentation").
broken_intra_doc_links = "deny"
